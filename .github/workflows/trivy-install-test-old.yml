name: trivy-install-test-old

on:
  push:
    branches: [test/trivy-install]

jobs:
  test-old:
    runs-on: ubuntu-24.04-arm
    steps:
      # The ORIGINAL step, kept here only to prove it is broken.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.69.3
          cache: true

      - name: Trivy scan (Docker image)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: alpine:3.20
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-setup-trivy: true
